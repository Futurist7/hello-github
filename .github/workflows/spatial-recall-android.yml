name: Spatial Recall – Android

on:
  push:
    paths: ['spatial_recall/**', '.github/workflows/spatial-recall-android.yml']
  pull_request:
    paths: ['spatial_recall/**', '.github/workflows/spatial-recall-android.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: spatial_recall

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Optional release signing. Add these repository secrets to produce a
      # Play-uploadable bundle; without them the build is debug-signed.
      #   ANDROID_KEYSTORE_BASE64  base64 of the upload .jks
      #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: spatial-recall-release
          path: |
            spatial_recall/build/app/outputs/flutter-apk/app-release.apk
            spatial_recall/build/app/outputs/bundle/release/app-release.aab
